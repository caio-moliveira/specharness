name: PR
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python .claude/hooks/schema_validate.py specs/*.md

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    # ADR-002 promete migrações testadas nos DOIS bancos. Sem este service, a
    # metade Postgres da suíte de contrato nunca roda e o critério fica verde
    # por ausência de teste (SPEC-004, decisão E3).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: specharness
          POSTGRES_PASSWORD: specharness
          POSTGRES_DB: specharness
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --python ${{ matrix.python-version }}
      - run: uv run pytest --cov=packages --cov-report=term-missing
        env:
          # O produto só conhece SPECHARNESS_DATABASE_URL; esta variável é do
          # harness de teste, para que os casos SQLite continuem rodando na
          # mesma sessão.
          SPECHARNESS_TEST_POSTGRES_URL: postgresql://specharness:specharness@localhost:5432/specharness

  test-integrity:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync
      - run: uv run python scripts/test_integrity.py --base origin/${{ github.base_ref }}
      - run: uv run pytest packages/core --cov=specharness_core --cov-fail-under=85
      # Métrica 4 da SPEC-004. No CI para não apodrecer como métrica só-local.
      - run: uv run pytest packages/adapters --cov=specharness_adapters.db --cov-fail-under=90
      # Cobertura do adapter de LLM (SPEC-005). No CI pela mesma razão.
      - run: uv run pytest packages/adapters --cov=specharness_adapters.llm --cov-fail-under=90
      # Cobertura dos adapters de repositório: git + GitHub (SPEC-006).
      - run: uv run pytest packages/adapters --cov=specharness_adapters.git --cov=specharness_adapters.github --cov=specharness_adapters.db.repository_store --cov-fail-under=90
      # Cobertura do adapter de tracker: Redmine + store (SPEC-007).
      - run: uv run pytest packages/adapters --cov=specharness_adapters.redmine --cov=specharness_adapters.db.workitem_store --cov-fail-under=90
      # Cobertura do adapter de GitHub Issues (SPEC-008).
      - run: uv run pytest packages/adapters --cov=specharness_adapters.github_issues --cov-fail-under=90
      # Cobertura da camada LLM do Readiness Gate: gate + stores (SPEC-011).
      - run: uv run pytest packages/adapters --cov=specharness_adapters.llm.gate --cov=specharness_adapters.db.readiness_store --cov-fail-under=90
