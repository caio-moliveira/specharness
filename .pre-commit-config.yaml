repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Deve acompanhar a versão de ruff resolvida em uv.lock: com versões
    # diferentes, `just lint` e o pre-commit reformatam um contra o outro e
    # o commit nunca fecha (visto com 0.8.4 aqui vs. 0.16.0 no .venv).
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: spec-trailer-check
        name: commit exige trailer 'Spec:' válido (ADR do projeto)
        entry: uv run python .claude/hooks/trailer_check.py
        language: system
        stages: [commit-msg]
      - id: spec-schema-validate
        name: specs/*.md devem passar no schema (SPEC-001 §7)
        entry: uv run python .claude/hooks/schema_validate.py
        language: system
        files: ^specs/.*\.md$
