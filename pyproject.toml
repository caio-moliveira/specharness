[project]
name = "specharness-workspace"
version = "0.1.0"
description = "specharness — decision, quality and metrics layer for spec-driven development with coding agents"
requires-python = ">=3.11"
dependencies = [
  "specharness-core",
  "specharness-cli",
  "specharness-server",
  "specharness-metrics",
  "specharness-adapters",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
specharness-core = { workspace = true }
specharness-cli = { workspace = true }
specharness-server = { workspace = true }
specharness-metrics = { workspace = true }
specharness-adapters = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.8",
  "pre-commit>=4.0",
  "hypothesis>=6.100",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "-q"
# Repo root on the path so tests can import the eval runner (evals/) — SPEC-011.
pythonpath = ["."]

[tool.pyright]
include = ["packages/core/src", "packages/metrics/src"]
typeCheckingMode = "strict"
