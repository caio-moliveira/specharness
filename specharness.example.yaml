# specharness — configuração do projeto (exemplo). Copie para specharness.yaml.
#
# Roteamento de modelos por tarefa (SPEC-005). As KEYS NUNCA vão aqui — elas
# vêm só de variáveis de ambiente (ADR-006, métrica 3). Veja .env.example.
llm:
  # Modelo usado quando a tarefa não tem override.
  default: anthropic/claude-sonnet-4-6

  # Modelo por tarefa. A chamada usa o modelo da tarefa, não o default.
  tasks:
    readiness_gate: anthropic/claude-haiku-4-5

  # Tentado quando a chamada principal falha em runtime (degradação — ADR-006).
  fallback: ollama/llama3.2

# Adapter de Jira (SPEC-019). Credenciais NUNCA vão aqui — JIRA_URL,
# JIRA_EMAIL e JIRA_TOKEN vêm só do ambiente (.env). O status_map traduz o
# status canônico da spec para o nome de status do SEU workflow no write-back.
# jira:
#   project: KAN
#   status_map:
#     done: Concluído
