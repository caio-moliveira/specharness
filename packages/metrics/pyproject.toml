[project]
name = "specharness-metrics"
version = "0.1.0"
description = "specharness metric snapshots, series and queries (SPEC-013)"
requires-python = ">=3.11"
dependencies = ["specharness-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specharness_metrics"]
