[project]
name = "specharness-adapters"
version = "0.1.0"
description = "specharness adapters: trackers, git providers, LLM, importers (ports & adapters - ADR-001)"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "specharness-core",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specharness_adapters"]
