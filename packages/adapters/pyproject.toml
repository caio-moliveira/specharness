[project]
name = "specharness-adapters"
version = "0.1.0"
description = "specharness adapters: trackers, git providers, LLM, importers (ports & adapters - ADR-001)"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "specharness-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specharness_adapters"]
