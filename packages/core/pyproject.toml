[project]
name = "specharness-core"
version = "0.1.0"
description = "specharness domain: Spec Registry, schema, parser, lifecycle, gates (ports only - no I/O)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specharness_core"]
