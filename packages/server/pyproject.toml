[project]
name = "specharness-server"
version = "0.1.0"
description = "specharness web API (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "specharness-core",
    "specharness-adapters",
    "python-dotenv>=1.0",
]

[tool.uv.sources]
specharness-core = { workspace = true }
specharness-adapters = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specharness_server"]

# O dashboard compilado (SPEC-021) é um artefato de build gitignored; `artifacts`
# no nível de build garante que ele entre no sdist E no wheel — necessário porque
# o `uv build` empacota o wheel a partir do sdist, num diretório isolado.
[tool.hatch.build]
artifacts = ["src/specharness_server/_web/**"]

# Build hook: FALHA o wheel se o dashboard não foi compilado (não roda em
# instalação editável). Ver hatch_build.py.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
