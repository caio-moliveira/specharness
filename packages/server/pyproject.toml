[project]
name = "specharness-server"
version = "0.1.0"
description = "specharness web API (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "specharness-core",
    "specharness-adapters",
    "python-dotenv>=1.0",
]

[tool.uv.sources]
specharness-core = { workspace = true }
specharness-adapters = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specharness_server"]
