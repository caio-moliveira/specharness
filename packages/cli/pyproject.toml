[project]
name = "specharness-cli"
version = "0.1.0"
description = "specharness command-line interface"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "rich>=13.7", "specharness-core"]

[project.scripts]
specharness = "specharness_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specharness_cli"]
